<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./javaScript/game.js"></script>
    <title>El pollo loco</title>
</head>
<body>
    <h1>El pollo loco</h1>
    <div id="wrprCanvas" class="wrprCanvasStyle">
        <canvas id="canvas" width="720" height="480"></canvas>
        <section id="overlay" class="overlayStyle">
            <div id="btnsTop" class="btnsTopStyle">
                <button id="btnMute" class="btnMuteStyle">Mute</button>
            </div>
            <div id="btnsBottom" class="btnsBottomStyle">
                <button id="btnRestart" class="btnRestartStyle hide">Restart</button>
                <button id="btnStartGame" class="btnStartGameStyle">Start Game</button>
                <button id="btnHome" class="btnHomeStyle hide">Homescreen</button>
            </div>
        </section>
    </div>
</body>
</html>
