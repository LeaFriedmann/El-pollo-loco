<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="./img/3_enemies_chicken/chicken_small/1_walk/1_w.png" type="image/x-icon" />
        <link rel="icon" href="./img/3_enemies_chicken/chicken_small/1_walk/1_w.png" type="image/x-icon" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Sancreek&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="./style.css" />
        <script type="module" src="./javaScript/game.js"></script>
        <title>El pollo loco</title>
    </head>
    <body>
        <h1>El pollo loco</h1>
        <div id="wrprCanvas" class="wrprCanvasStyle">
            <canvas id="canvas" width="720" height="480"></canvas>
            <section id="overlay" class="overlayStyle">
                <div id="btnsTop" class="btnsTopStyle">
                    <button id="btnMute" class="btnMuteStyle btnsStyle"></button>
                    <div id="btnStartWrpr" class="btnStartWrprStyle">
                        <button id="btnStartGame" class="btnStartGameStyle btnsStyle">Start Game</button>
                    </div>
                </div>
                <div id="btnsBottom" class="btnsBottomStyle">
                    <section id="btnsPostGame" class="btnsPostGameStyle hide">
                        <button id="btnRestart" class="btnRestartStyle btnsStyle">Restart</button>
                        <button id="btnNextLvl" class="btnNextLvlStyle btnsStyle">Next Level</button>
                        <button id="btnHome" class="btnHomeStyle btnsStyle">Homescreen</button>
                    </section>
                    <section id="mobileBtns" class="mobileBtnsStyle hide">
                        <div class="btnSect">
                            <button id="btnLeft" class="btnLeftStyle btnsStyle">
                                <img src="./img/icons/arrow-left.png" alt="Button left" />
                            </button>
                            <button id="btnRight" class="btnRightStyle btnsStyle">
                                <img src="./img/icons/arrow-right.png" alt="Button right" />
                            </button>
                        </div>
                        <div class="btnSect">
                            <button id="btnJump" class="btnJumpStyle btnsStyle">
                                <img src="./img/icons/arrow-up.png" alt="button jump" />
                            </button>
                            <button id="btnThrow" class="btnThrowStyle btnsStyle">
                                <img src="./img/6_salsa_bottle/salsa_bottle.png" alt="button throw" />
                            </button>
                        </div>
                    </section>
                </div>
            </section>
        </div>
    </body>
</html>
